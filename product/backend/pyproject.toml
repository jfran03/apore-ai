[project]
name = "apore-backend"
version = "0.1.0"
description = "Apore desktop application backend (local tutor runtime + HTTP API)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "anthropic>=0.40.0",
  "openai>=1.55.0",
  "pydantic>=2.10.0",
  "markitdown>=0.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
